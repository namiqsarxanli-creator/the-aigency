[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# FastAPI-nin köhnə `on_event` xəbərdarlıqları və Python 3.14-ün datetime deprecation-ları
# test çıxışını doldurur — bunlar üçüncü tərəf/planlaşdırılmış miqrasiyalardır, testin
# nəticəsinə təsir etmir.
filterwarnings =
    ignore::DeprecationWarning
